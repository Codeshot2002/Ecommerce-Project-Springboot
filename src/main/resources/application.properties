spring.application.name=ecommerce.project

# ===============================
# Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/microservice}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# Flyway
# ===============================
spring.flyway.baseline-on-migrate=true

# ===============================
# Application
# ===============================
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# IMPORTANT: no real secret here
app.jwt.secret=${JWT_SECRET:change-me-in-local-env}

app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=order-status-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.project.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.project.events.OrderCreatedEvent

# ===============================
# Redis
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics